name: Feature Request
description: Propose an idea or enhancement for Socratic GTM Strategist
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make Socratic GTM Strategist more useful? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific founder GTM challenge or platform gap?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how this feature should work and what value it delivers.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative workflows or tools you've looked at?
