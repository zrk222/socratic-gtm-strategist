[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-gtm-strategist"
version = "3.0.0"
description = "Socratic GTM Strategist for AI Startups (v3.0) - Socratic advisor & 5-module execution toolkit"
readme = "README.md"
authors = [
    { name = "Rick Katz", email = "rkatz22@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Intended Audience :: Developers"
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
socratic-gtm = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "socratic_gtm*"]
